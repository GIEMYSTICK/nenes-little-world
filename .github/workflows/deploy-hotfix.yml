name: Deploy navigation hotfix
on:
  push:
    paths:
      - nene-nav-hotfix.zip
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract hotfix
        run: |
          unzip -o nene-nav-hotfix.zip -d /tmp/nene-hotfix
          cp /tmp/nene-hotfix/MobileNavigation.tsx components/MobileNavigation.tsx
          cp /tmp/nene-hotfix/MobileNavigation.module.css components/MobileNavigation.module.css
          rm nene-nav-hotfix.zip
          rm .github/workflows/deploy-hotfix.yml
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile bottom navigation styling"
          git push
