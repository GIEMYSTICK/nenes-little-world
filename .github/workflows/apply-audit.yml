name: Apply audited production update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-audit.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified project changes
        shell: bash
        run: |
          cat > /tmp/nene-audit.patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/nene-audit.patch.b64 > /tmp/nene-audit.patch
          git apply --index /tmp/nene-audit.patch
          rm -f .github/workflows/apply-audit.yml apply-audit.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit production app and add deployment guide"
          git push origin main
