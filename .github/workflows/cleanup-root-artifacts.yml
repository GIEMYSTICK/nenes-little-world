name: Clean legacy root artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-root-artifacts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy duplicate files
        shell: bash
        run: |
          git rm -f -- \
            FacebookComments.tsx Footer.tsx Gallery.tsx Hero.tsx \
            MotionController.tsx Navbar.tsx NeneAge.tsx SectionHeading.tsx \
            components/FacebookComments.tsx globals.css layout.tsx page.tsx nene.ts \
            first-day-home.mp4 fva.png nene-awake.jpeg nene-blue-hat.jpeg \
            nene-car-seat.jpeg nene-card.png nene-introduction.mp4 nene-joy.png \
            nene-milk.jpeg nene-one-month.jpeg nene-pink-blanket.jpeg \
            nene-sleeping.jpeg nene-smile.jpeg nene-th.vtt nene-wink.jpeg \
            nene_site_logo.png one-month.mp4 \
            app/data-deletion/.gitkeep app/privacy/.gitkeep \
            public/.gitkeep public/captions/.gitkeep public/images/.gitkeep \
            public/videos/.gitkeep
          rm -f .github/workflows/cleanup-root-artifacts.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean legacy duplicate root files"
          git push origin main
