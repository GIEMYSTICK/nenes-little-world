name: Deploy loading screen
on:
  push:
    paths:
      - nene-loading-deploy.zip
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract update
        run: |
          unzip -o nene-loading-deploy.zip -d /tmp/nene-loading
          cp /tmp/nene-loading/loading.tsx app/loading.tsx
          cp /tmp/nene-loading/loading.module.css app/loading.module.css
          rm nene-loading-deploy.zip
          rm .github/workflows/deploy-loading.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add playful Nene route loading screen"
          git push
