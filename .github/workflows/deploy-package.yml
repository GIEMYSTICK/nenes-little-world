name: Install deployment package

on:
  push:
    paths:
      - nene-deploy.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install package into repository
        run: |
          unzip -o nene-deploy.zip
          rm -f nene-deploy.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Supabase commerce and admin dashboard"
          git push
