name: Deploy package
on:
  push:
    paths:
      - nene-image-upload-deploy.zip
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract update
        run: |
          unzip -o nene-image-upload-deploy.zip
          rm nene-image-upload-deploy.zip
          rm .github/workflows/deploy-package.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add admin image uploads and media management"
          git push
